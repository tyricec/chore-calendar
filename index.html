<!DOCTYPE html>
<html lang="en">

<head>
    <title>Chore Marks</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <style>
        html {
            font-family: "Helvetica", "Arial", sans-serif;
        }

        button {
            margin: 8px;
            padding: 8px;
            font-size: 16px;
        }

        table {
            table-layout: fixed;
            border-collapse: collapse;
            width: 100%;
            min-width: 660px;
            margin: 16px 0;
        }

        th,
        td {
            padding: 8px;
            text-align: center;
            border: 1px solid #f0f0f0;
        }

        .today {
            background-color: #33a0af;
            color: white;
        }

        .missed {
            background-color: #a20000;
            color: white;
        }

        dialog {
            max-width: 480px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 16px 24px;
        }

        dialog::backdrop {
            background-color: rgba(0, 0, 0, 0.4);
        }

        #summary-container table {
            min-width: 0;
            max-width: 480px;
        }

        #summary-container td,
        #summary-container th {
            border-color: #ccc;
        }

        .month-trigger {
            margin: 0;
            padding: 2px 0;
            font-size: inherit;
            color: #a20000;
            background: none;
            border: none;
            text-decoration: underline dotted;
            cursor: pointer;
        }

        .calendar-popover {
            position: fixed;
            inset: auto;
            margin: 0;
            width: 260px;
            max-width: calc(100vw - 16px);
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .calendar-close {
            margin: 0;
            padding: 0;
            width: 32px;
            height: 32px;
            font-size: 20px;
            line-height: 1;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            cursor: pointer;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 14px;
        }

        .calendar-day-label {
            font-weight: bold;
            font-size: 12px;
        }

        .calendar-day {
            padding: 4px 0;
            border-radius: 4px;
        }

        .calendar-footer {
            margin: 8px 0 0;
            font-size: 14px;
        }

        .loading {
            display: flex;
            width: 100%;
            height: 60vh;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <h1>Chore Marks</h1>
    <p>
        For each person, check the box if they missed their chore for that day.
    </p>
    <p>
        <b>Note:</b> The current day is highlighted in blue. If a chore is missed, the cell will turn red with an "X".
        Only 18 months of history will be stored.
    </p>
    <button id="clear-marks">Clear Marks</button>
    <button id="history">View History</button>
    <button id="summary">View Summary</button>
    <button id="save-file">Save to File</button>
    <button id="view-file">View File</button>
    <button id="restore-file">Restore From File</button>
    <button id="reset-data">Reset Data</button>
    <button id="refresh-page">Refresh</button>
    <table>
        <thead>
            <tr>
                <th scope="col" colSpan="2">Date</th>
                <th scope="col">Day</th>
                <th scope="col">Michael</th>
                <th scope="col">Shocka</th>
                <th scope="col">Brooke</th>
                <th scope="col">Jacob</th>
                <th scope="col">Duke</th>
            </tr>
        </thead>
        <tbody>
            <!-- Rows will be added dynamically -->
        </tbody>
    </table>

    <!-- The error handler is a classic script so it is registered before the app modules run. -->
    <script src="js/error-handler.js"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
